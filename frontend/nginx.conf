server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change; cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry point must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/trades, /markets, ...) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
